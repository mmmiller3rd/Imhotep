<html>
    <head>
        <style>
            body {
                /* z-index: 1; */
                margin: 0;
                /* width: 58%; */
                /* width: 100%; */
                /* height: 100%; */
                background-color: rgb(100, 175, 235);
                /* opacity: 80%; */
                #background {
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    z-index: -2;
                }
                #title {
                    width: fit-content;
                    font-size: 5em;
                    font-weight: bolder;
                    font-family: 'papyrus', fantasy;
                    margin: 0 auto;
                    height: 130px;
                }
                #name {
                    width: fit-content;
                    font-size: 3em;
                    font-family: 'papyrus', fantasy;
                    margin: 12.5% auto;
                    font-weight: bold;
                    height: 80px;
                    color: coral;
                }
                #header {
                    width: fit-content;
                    font-size: 2em;
                    font-family: 'papyrus', fantasy;
                    margin: 0 auto;
                    margin-top: 15px;
                    font-weight: bold;
                    padding: 5px;
                    border-left: 2px solid black;
                    border-right: 2px solid black;
                    border-bottom: 2px solid black;
                    border-radius: 5px;
                }
                .section {
                    width: 30%;
                    overflow: hidden;
                    height: 35%;
                    background-color: rgba(100, 132, 235, 0.7);
                    position: absolute;
                    margin: 2% 10%;
                    color: rgb(255, 255, 255);
                    /* background-image: url(border.png); */
                    border-radius: 10px;
                }
                #studentSpotlight {
                    top: 0;
                    left: 0;
                }
                #reminders {
                    top: 0;
                    right: 0;
                }
                #recap {
                    bottom: 15%;
                    left: 0;
                }
                #upcoming {
                    bottom: 15%;
                    right: 0;
                }
                #tips {
                    bottom: 0;
                    right: 0;
                    margin: 2% 30%;
                }
            }
        </style>
        <title></title>
    </head>
    <Body>
        <img id="background" src="Firefly_technology spelled out in neon lights 671743.jpg"/>
        <div id="name">Mr. Miller</div>
        <div id="studentSpotlight" class="section">
            <div id="header">Student Spotlight</div>
        </div>
        <div id="reminders" class="section">
            <div id="header"> Reminders</div>
        </div>
        <div id="recap" class="section">
            <div id="header">Recap</div>
        </div>
        <div id="upcoming" class="section">
            <div id="header">What's Next</div>
        </div>
        <div id="tips" class="section">
            <div id="header">Tips & Tricks</div>
        </div>
    </Body>
</html>
